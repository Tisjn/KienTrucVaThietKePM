spring.application.name=payment-notification-service
server.port=8081

# External Order Service host (do not use localhost here).
order.service.host=172.16.51.150

# PostgreSQL connection (converted from DATABASE_URL format).
spring.datasource.url=jdbc:postgresql://172.16.51.150:5439/order_service?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# show SQL in logs for development (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (development defaults) - must be long enough for HS256 (>=32 bytes)
app.jwt.secret=changeit-dev-secret-please-change-0123456789ABCDEF
app.jwt.expiration-ms=3600000
